const byte pb = 2;
const byte red = 4;
const byte blue = 6;
const byte green = 5;
const byte buzz = 7;
const byte trig = 9;
const byte echo = 10;

const float c = 65.4;
const float d = 73.4;
const float e = 82.4;
const float f = 87.3;
const float g = 98;
const float a = 110;
const float b = 123.5;
const float hc = 130.8;

float currTemp;
float duration, distance;
volatile bool Stop = false;

void setup()
{
  pinMode(pb, INPUT_PULLUP);
  pinMode(red, OUTPUT);
  pinMode(blue, OUTPUT);
  pinMode(green, OUTPUT);
  pinMode(buzz , OUTPUT);
  pinMode(trig, OUTPUT);
  pinMode(echo, INPUT);
  attachInterrupt(digitalPinToInterrupt(pb),pb_isr, FALLING);
  
  Serial.begin(9600);
}

void loop()
{
  digitalWrite(trig, LOW);
  delay(2);
  digitalWrite(trig, HIGH);
  delay(10);
  digitalWrite(trig, LOW);

  duration = pulseIn(echo, HIGH);
  distance = (duration * 0.0343)/2;
  Serial.println(distance);
  
  buzzing();
}

void pb_isr(){
  Stop = !Stop;
}

void buzzing(){
  uint8_t numNotes = 14;
  char notes[numNotes] = {c,c,g,g,a,a,g,f,f,e,e,d,d,c};
  
  for(int i = 0; i<numNotes;i++){
    digitalWrite(trig, LOW);
    delay(2);
    digitalWrite(trig, HIGH);
    delay(10);
    digitalWrite(trig, LOW);
    
    duration = pulseIn(echo, HIGH);
    distance = (duration * 0.0343)/2;
    Serial.println(distance);
    
    if(distance > 30){
    	noTone(buzz);
      digitalWrite(green, LOW);
      digitalWrite(red, HIGH);
      digitalWrite(blue, LOW);
      
    	break;
      return;
    }
    else if(Stop == true){
    	noTone(buzz);
      digitalWrite(green, LOW);
      digitalWrite(red, LOW);
      digitalWrite(blue, HIGH);
      
    	break;
      return;
    }
    
    digitalWrite(green, HIGH);
    digitalWrite(red, LOW);
    digitalWrite(blue, LOW);
    tone(buzz, notes[i]);
    delay(450);
  }
}